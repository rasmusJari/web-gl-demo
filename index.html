<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>WebGL_Placeholder_App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
<div id="unity-container">
    <canvas id="unity-canvas"></canvas>
</div>

<script src="Build/webgldemo.loader.js"></script>
<script>
    const buildUrl = "Build";
    const config = {
        dataUrl: buildUrl + "/webgldemo.data.br",
        frameworkUrl: buildUrl + "/webgldemo.framework.js.br",
        codeUrl: buildUrl + "/webgldemo.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "WebGL_Placeholder_App",
        productVersion: "0.1.0",
        devicePixelRatio: window.devicePixelRatio || 1
    };

    createUnityInstance(document.querySelector("#unity-canvas"), config).then((unityInstance) => {
        window.unityInstance = unityInstance;
    }).catch((message) => {
        alert("Failed to load Unity WebGL build.\n\n" + message);
    });
</script>
