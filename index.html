<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Game Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
        }

        #unity-canvas {
            width: 100vw;
            height: 100dvh;
            display: block;
            background: #4287f5;
        }

        #loadingBox {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: #e10915;
            z-index: 10;
            width: 100%;
            height: 50vh;

            .loading-text {
                color: white;
                margin-bottom: 10px;
                font-size: 24px;
                text-align: center;
            }
        }
    </style>
</head>
<body>


<canvas id="unity-canvas"></canvas>

<script src="Build/5d61f84fc9f63ea4f72963b8e230cb98.loader.js"></script>
<script>
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        const meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.head.appendChild(meta);

        const canvas = document.getElementById("unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";

    }

    createUnityInstance(document.getElementById("unity-canvas"), {
        arguments: [],
        dataUrl: "Build/c6c67dda3c89f1ab293108d30dfcff55.data.unityweb",
        frameworkUrl: "Build/94bfa2d1825acc464355cd2c3e24b9bb.framework.js.unityweb",
        codeUrl: "Build/0825025b296529a6d6d7c384c57ae119.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
    productName: "spikes-game",
    productVersion: "1.0",
    }).then((unityInstance) => {
        window.unityInstance = unityInstance;
    }).catch((message) => { alert(message); });
    
    window.addEventListener("message", function(event) {

        if (!event.data || event.data.type !== "INIT_DATA")
            return;

        console.log("Received data from host:", event.data.payload);

        if (typeof window.unityInstance !== "undefined") {
            window.unityInstance.SendMessage(
                "ExternalBridge",
                "OnInitData",
                JSON.stringify(event.data.payload)
            );
        }
    });

    // window.postMessage(
    //     {
    //         type: "INIT_DATA"
    //     },
    //     "*" // you can restrict this to your domain later
    // );

</script>
</body>
</html>
